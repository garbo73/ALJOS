cd ~/aljos

mkdir -p .github/workflows

rm -f .github/workflows/build-aljos.yml

cat > .github/workflows/main.yml <<'EOF'
name: Build ALJOS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Aceptar licencias e instalar herramientas
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Compilar ALJOS
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Comprobar APK
        run: |
          ls -lh out/ALJOS.apk
          test -f out/ALJOS.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ALJOS-FireTV
          path: out/ALJOS.apk
          if-no-files-found: error
EOF

git add .github/workflows/main.yml .github/workflows/build-aljos.yml
git commit -m "Actualizar workflow de compilacion ALJOS"
git push origin main
